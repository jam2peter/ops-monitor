name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile
        run: python3 -m compileall -q src tests

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate example config
        run: python3 -m json.tool examples/config.json >/dev/null

      - name: Sanitization scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '192\.168\.|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.' --exclude-dir=.git .
          ! grep -RInE '(ghp_|github_pat_|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' --exclude-dir=.git .
